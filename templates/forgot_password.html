<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TifLAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/home_backdrop.css">
</head>
<body class="site-backdrop business-theme min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <a href="/login" class="flex justify-center mb-6 text-slate-300 hover:text-white items-center">
            <i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Back to Sign In
        </a>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
            Reset your password
        </h2>
        <p class="mt-2 text-center text-sm text-slate-300">
            Enter your email and we'll send you a reset link.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="border border-slate-700 bg-slate-900/85 py-8 px-4 shadow-2xl backdrop-blur-sm sm:rounded-lg sm:px-10">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="mb-4 px-4 py-3 rounded-md text-sm {% if category == 'error' %}bg-red-900/50 border border-red-500/50 text-red-300{% else %}bg-green-900/50 border border-green-500/50 text-green-300{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form class="space-y-6" action="/forgot-password" method="POST">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-200">
                        Email address
                    </label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            class="focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 sm:text-sm border-slate-700 bg-slate-950 text-white rounded-md py-2 border"
                            placeholder="you@example.com"
                        >
                    </div>
                </div>

                <div>
                    <button
                        type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500"
                    >
                        Send reset link
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
